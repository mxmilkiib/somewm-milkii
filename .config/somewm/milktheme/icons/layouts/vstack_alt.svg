  <rect x="8" y="37" width="49" height="9" rx="1" ry="1" fill="none" stroke="#888888" stroke-width="0.25"/>
  <!-- Slave window 2 -->
  <rect x="8" y="47" width="49" height="10" rx="1" ry="1" fill="#CCCCCC"/>
  <rect x="8" y="47" width="49" height="10" rx="1" ry="1" fill="none" stroke="#888888" stroke-width="0.25"/>
