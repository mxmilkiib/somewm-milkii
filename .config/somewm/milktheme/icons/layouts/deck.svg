  <!-- Window fill -->
  <rect x="12" y="12" width="40" height="32" fill="#CCCCCC"/>
  <!-- Window border -->
  <rect x="12" y="12" width="40" height="32" fill="none" stroke="#333333" stroke-width="1"/>
  <!-- Window fill -->
  <rect x="16" y="16" width="32" height="24" fill="#CCCCCC"/>
  <!-- Window border -->
