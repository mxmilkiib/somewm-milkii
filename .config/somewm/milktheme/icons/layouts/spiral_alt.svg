<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" xmlns="http://www.w3.org/2000/svg">
  <!-- Purple margin/background -->
  <rect x="0" y="0" width="64" height="64" fill="#623997"/>

  <!-- Black background -->
  <rect x="4" y="4" width="56" height="56" fill="#000000"/>
  <!-- Window 1: left half -->
  <rect x="8" y="8" width="23" height="49" rx="1" ry="1" fill="#CCCCCC"/>
  <rect x="8" y="8" width="23" height="49" rx="1" ry="1" fill="none" stroke="#888888" stroke-width="0.25"/>
  <!-- Window 2: right-top quarter -->
  <rect x="32" y="8" width="25" height="23" rx="1" ry="1" fill="#CCCCCC"/>
  <rect x="32" y="8" width="25" height="23" rx="1" ry="1" fill="none" stroke="#888888" stroke-width="0.25"/>
  <!-- Window 3: right-bottom-left -->
  <rect x="32" y="32" width="12" height="25" rx="1" ry="1" fill="#CCCCCC"/>
  <rect x="32" y="32" width="12" height="25" rx="1" ry="1" fill="none" stroke="#888888" stroke-width="0.25"/>
  <!-- Window 4: right-bottom-right -->
  <rect x="45" y="32" width="12" height="25" rx="1" ry="1" fill="#CCCCCC"/>
  <rect x="45" y="32" width="12" height="25" rx="1" ry="1" fill="none" stroke="#888888" stroke-width="0.25"/>
</svg>
