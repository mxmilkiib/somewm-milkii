  <rect x="24" y="8" width="15" height="6" rx="1" ry="1" fill="#777777"/>
  <rect x="24" y="8" width="15" height="6" rx="1" ry="1" fill="none" stroke="#555555" stroke-width="0.25"/>
  <rect x="40" y="8" width="15" height="6" rx="1" ry="1" fill="#777777"/>
  <rect x="40" y="8" width="15" height="6" rx="1" ry="1" fill="none" stroke="#555555" stroke-width="0.25"/>
  <!-- Single visible window (top of deck) -->
  <rect x="8" y="15" width="49" height="42" rx="1" ry="1" fill="#CCCCCC"/>
  <rect x="8" y="15" width="49" height="42" rx="1" ry="1" fill="none" stroke="#888888" stroke-width="0.25"/>
